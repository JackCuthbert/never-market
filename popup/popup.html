<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Never Market</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --surface: #f3f5f7;
        --border: #d9dee4;
        --text: #15191e;
        --muted: #54606d;
        --accent: #16a34a;
        --accent-text: #15803d;
        --track: #8a95a1;
        --thumb: #ffffff;
        --focus: #1a5fd0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16191e;
          --surface: #20252c;
          --border: #343b45;
          --text: #f1f3f5;
          --muted: #a7b0bb;
          --accent: #4ade80;
          --accent-text: #4ade80;
          --track: #6c7785;
          --thumb: #16191e;
          --focus: #7fb0ff;
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); }
      body:not([data-ready]) main { visibility: hidden; }
      main {
        width: 320px;
        padding: 16px;
        color: var(--text);
        background: var(--bg);
        font-size: 13px;
        line-height: 1.4;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
      .brand { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; }
      .brand img { width: 20px; height: 20px; }
      .where { display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      main[data-state='off'] .dot { background: var(--track); }
      main[data-state='unsupported'] .where, main[data-state='unsupported'] #status { display: none; }
      #status { margin: 0 0 14px; padding: 12px; background: var(--surface); border-radius: 10px; }
      #stats { margin: 0; font-weight: 600; }
      main[data-state='filtered'] #stats, main[data-state='off'] #stats { font-weight: 400; color: var(--muted); }
      .meter { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
      .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--border); overflow: hidden; }
      #fill { display: block; transition: width 0.2s; height: 100%; width: 0; border-radius: 999px; background: var(--accent); }
      #percent { min-width: 3ch; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
      main:not([data-state='on']) .meter { display: none; }
      #note { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
      #note[hidden] { display: none; }
      #extra { margin: 8px 0 0; font-weight: 600; }
      #unfilter { margin: 10px 0 0; padding: 5px 12px; font: inherit; font-weight: 600; color: var(--accent-text); background: none; border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; }
      #unfilter:focus-visible, #store-list a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      main:not([data-state='filtered']) #unfilter { display: none; }
      #supported { margin: 0 0 14px; }
      #supported p { margin: 0 0 8px; color: var(--muted); }
      #store-list { margin: 0; padding: 0; list-style: none; }
      #store-list li + li { border-top: 1px solid var(--border); }
      #store-list a { display: block; padding: 8px 0; color: var(--text); text-decoration: none; }
      #store-list a:hover { color: var(--accent-text); text-decoration: underline; }
      main:not([data-state='unsupported']) #supported { display: none; }
      main[data-state='unsupported'] .settings { display: none; }
      main[data-state='unsupported'] #supported { margin-bottom: 0; }
      .settings { border-top: 1px solid var(--border); }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; cursor: pointer; }
      .row + .row:not([hidden]) { border-top: 1px solid var(--border); }
      .title { display: block; font-weight: 600; }
      .desc { display: block; color: var(--muted); font-size: 12px; }
      #filters-row[hidden] { display: none; }
      main[data-state='off'] #filters-row { opacity: 0.7; }
      input[role='switch'] {
        appearance: none;
        flex: none;
        position: relative;
        width: 40px;
        height: 24px;
        margin: 0;
        border-radius: 999px;
        background: var(--track);
        cursor: pointer;
        transition: background-color 0.15s;
      }
      input[role='switch']::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--thumb);
        transition: transform 0.15s;
      }
      input[role='switch']:checked { background: var(--accent); }
      input[role='switch']:checked::after { transform: translateX(16px); }
      input[role='switch']:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      @media (prefers-reduced-motion: reduce) {
        input[role='switch'], input[role='switch']::after, #fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <main data-state="unsupported">
      <header>
        <span class="brand"><img src="../icons/icon-32.png" alt="" />Never Market</span>
        <span class="where"><span class="dot" aria-hidden="true"></span><span id="store"></span></span>
      </header>
      <section id="status" aria-live="polite">
        <p id="stats"></p>
        <div class="meter">
          <div class="bar" aria-hidden="true"><span id="fill"></span></div>
          <span id="percent"></span>
        </div>
        <p id="extra" hidden></p>
        <p id="note" hidden></p>
        <button type="button" id="unfilter">Turn off store filters</button>
      </section>
      <section id="supported" aria-labelledby="supported-intro">
        <p id="supported-intro">Never Market hides marketplace listings on these stores.</p>
        <ul id="store-list"></ul>
      </section>
      <section class="settings">
        <label class="row" for="enabled">
          <span>
            <span class="title">Hide marketplace listings</span>
            <span class="desc" id="enabled-desc">Turn off to see every listing and compare the page.</span>
          </span>
          <input type="checkbox" role="switch" id="enabled" aria-describedby="enabled-desc" />
        </label>
        <label class="row" for="use-store-filters" id="filters-row">
          <span>
            <span class="title">Use store filters</span>
            <span class="desc" id="filters-desc">Ask the store for retailer-only results. Hiding still works when off.</span>
          </span>
          <input type="checkbox" role="switch" id="use-store-filters" aria-describedby="filters-desc" />
        </label>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
